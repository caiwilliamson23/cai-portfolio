<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — Cassius Design Studio</title>

</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header>
    <h1>Cassius Design Studio</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="work.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>
  <main id="main-content">
   <h2>Let's Bring Your Vision To Life!</h2>
<p>Have a project in mind? Tell me about it below and I'll get back to you.</p>
<form action="https://formspree.io/f/your-form-id" method="post">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone">

  <p>What type of project is it?</p>
  <label for="project-cover">Cover Art</label>
  <input type="radio" id="project-cover" name="project-type" value="cover-art" checked>

  <label for="project-logo">Logo</label>
  <input type="radio" id="project-logo" name="project-type" value="logo">

  <label for="project-flyer">Flyer</label>
  <input type="radio" id="project-flyer" name="project-type" value="flyer">

  <label for="project-other">Other</label>
  <input type="radio" id="project-other" name="project-type" value="other">

  <label for="message">Tell me about your project</label>
  <textarea id="message" name="message" required></textarea>

  <button type="submit">Send My Inquiry!</button>
</form>

  </main>
  <footer>
    <p>&copy; 2026 Cassius Design Studio</p>
  </footer>
</body>
</html>
